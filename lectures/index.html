<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTF 讲义中心</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 20% 0%, #0d2b1c 0%, #05100b 60%, #020805 100%);
    color: #d7f5e3; font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 60px 20px;
  }
  h1 { font-size: 34px; margin: 0 0 8px; color: #34d399; letter-spacing: 2px; }
  .sub { color: #7fbf9a; margin-bottom: 40px; font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; width: 100%; max-width: 900px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: linear-gradient(145deg, rgba(16,52,34,.9), rgba(8,28,18,.9));
    border: 1px solid #1f6b47; border-radius: 14px; padding: 26px 22px;
    transition: transform .18s, box-shadow .18s, border-color .18s;
  }
  a.card:hover { transform: translateY(-4px); border-color: #34d399; box-shadow: 0 10px 30px rgba(52,211,153,.18); }
  .ico { font-size: 34px; display: block; margin-bottom: 12px; }
  .name { font-size: 20px; font-weight: 700; color: #a7f3d0; }
  .desc { font-size: 13px; color: #6fae8a; margin-top: 8px; line-height: 1.6; }
  .tip { margin-top: 46px; color: #4f8a68; font-size: 12px; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
  <h1>CTF 讲义中心</h1>
  <div class="sub">Paralir 的网安讲义 · 选择一个方向开始阅读</div>
  <div class="grid">
    <a class="card" href="web/index.html"><span class="ico">🌐</span><div class="name">Web 安全</div><div class="desc">从零基础到 CTF Web 入门，HTTP、注入、XSS 等方向系统讲义</div></a>
    <a class="card" href="pwn/index.html"><span class="ico">💥</span><div class="name">PWN</div><div class="desc">二进制漏洞利用方向系统讲义，栈溢出、ROP、堆利用等</div></a>
    <a class="card" href="reverse/index.html"><span class="ico">🔍</span><div class="name">Reverse</div><div class="desc">逆向工程方向系统讲义，反汇编、动静态调试、算法还原</div></a>
    <a class="card" href="crypto/index.html"><span class="ico">🔐</span><div class="name">Crypto</div><div class="desc">密码学方向系统讲义，古典密码、对称与非对称、数论基础</div></a>
    <a class="card" href="misc/index.html"><span class="ico">🧩</span><div class="name">Misc</div><div class="desc">杂项方向系统讲义，隐写、编码、取证、脑洞题等</div></a>
  </div>
  <div class="tip">这些讲义是完全自包含的单个网页，可离线阅读、无需联网、无需安装。</div>
<script>
// 把当前的 sharecode 访问码自动附加到各讲义链接，保证子页面也能正常访问
(function(){
  var q = location.search || "";
  if(!q) return;
  document.querySelectorAll("a.card").forEach(function(a){
    var h = a.getAttribute("href");
    if(h && h.indexOf("?")<0) a.setAttribute("href", h + q);
  });
})();
</script>
</body>
</html>
